name: Build OpenCV Cross Platform
run-name: Build OpenCV ${{ inputs.opencv_version }} - ${{ inputs.target_platform }}${{ inputs.enable_contrib && ' +contrib' || '' }}${{ inputs.enable_jasper && ' +jasper' || '' }}${{ inputs.enable_cuda && ' +cuda' || '' }}${{ inputs.variant_tag != '' && format(' ({0})', inputs.variant_tag) || '' }}

on:
  workflow_dispatch:
    inputs:
      opencv_version:
        description: 'Phiên bản OpenCV cần build (vd: 4.14.0)'
        required: true
        default: '4.14.0'
      target_platform:
        description: 'Chọn nền tảng (OS - Arch)'
        type: choice
        required: true
        default: 'Win10-amd64'
        options:
          - Win10-amd64
          - Win11-amd64
          - Win11-arm64
          - Ubuntu22.04-amd64
          - Ubuntu22.04-arm64
          - Ubuntu24.04-amd64
          - Ubuntu24.04-arm64
          - MacOS-amd64
          - MacOS-arm64
      enable_contrib:
        description: 'Kèm module mở rộng opencv_contrib'
        type: boolean
        default: false
      contrib_version:
        description: 'Phiên bản/tag/commit của opencv_contrib (để trống = trùng opencv_version)'
        required: false
        default: ''
      enable_jasper:
        description: 'Bật hỗ trợ JPEG-2000 (JasPer)'
        type: boolean
        default: true
      enable_cuda:
        description: 'Bật CUDA (Chỉ áp dụng Win/Ubuntu amd64)'
        type: boolean
        default: false
      variant_tag:
        description: 'Nhãn hậu tố tùy chọn (vd: world, gstreamer - để trống nếu không cần)'
        required: false
        default: ''
      custom_cmake_flags:
        description: 'Cờ CMake bổ sung tùy ý (vd: -DWITH_GSTREAMER=ON -DBUILD_opencv_world=ON)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: >-
      ${{
        inputs.target_platform == 'Win10-amd64'       && 'windows-2022' ||
        inputs.target_platform == 'Win11-amd64'       && 'windows-2025' ||
        inputs.target_platform == 'Win11-arm64'       && 'windows-11-arm' ||
        inputs.target_platform == 'Ubuntu22.04-amd64' && 'ubuntu-22.04' ||
        inputs.target_platform == 'Ubuntu22.04-arm64' && 'ubuntu-24.04-arm' ||
        inputs.target_platform == 'Ubuntu24.04-amd64' && 'ubuntu-24.04' ||
        inputs.target_platform == 'Ubuntu24.04-arm64' && 'ubuntu-24.04-arm' ||
        inputs.target_platform == 'MacOS-amd64'       && 'macos-15-intel' ||
        'macos-latest'
      }}
    container: ${{ inputs.target_platform == 'Ubuntu22.04-arm64' && 'ubuntu:22.04' || null }}

    steps:
      - name: 1. Phân tách OS & Arch
        id: platform
        shell: bash
        run: |
          PLATFORM="${{ inputs.target_platform }}"
          OS_DIR="${PLATFORM%-*}"
          ARCH_DIR="${PLATFORM#*-}"
          echo "os_dir=$OS_DIR" >> $GITHUB_OUTPUT
          echo "arch_dir=$ARCH_DIR" >> $GITHUB_OUTPUT

      - name: 2. Cài công cụ & thư viện hệ thống (Ubuntu / Container)
        if: startsWith(steps.platform.outputs.os_dir, 'Ubuntu')
        shell: bash
        run: |
          SUDO=""
          command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y build-essential cmake ninja-build curl p7zip-full pkg-config \
            libgtk-3-dev libavcodec-dev libavformat-dev libswscale-dev \
            libjpeg-dev libpng-dev libtiff-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: 3. Cài đặt CUDA Toolkit (nếu bật enable_cuda)
        if: inputs.enable_cuda && steps.platform.outputs.arch_dir == 'amd64' && steps.platform.outputs.os_dir != 'MacOS' && inputs.target_platform != 'Ubuntu22.04-arm64'
        uses: Jimver/cuda-toolkit@v0.2.20
        with:
          cuda: '12.6.2'

      - name: 4. Thiết lập MSVC (Windows)
        if: startsWith(steps.platform.outputs.os_dir, 'Win')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ steps.platform.outputs.arch_dir == 'amd64' && 'x64' || 'arm64' }}

      - name: 5. Đảm bảo có Ninja (Windows / macOS)
        shell: bash
        run: |
          if [[ "${{ steps.platform.outputs.os_dir }}" == Win* ]]; then
            command -v ninja >/dev/null 2>&1 || choco install ninja -y
          elif [ "${{ steps.platform.outputs.os_dir }}" = "MacOS" ]; then
            brew install ninja
          fi

      - name: 6. Nhận diện Compiler & chốt tên file Release
        id: meta
        shell: bash
        run: |
          OS_DIR="${{ steps.platform.outputs.os_dir }}"
          ARCH_DIR="${{ steps.platform.outputs.arch_dir }}"
          VER="${{ inputs.opencv_version }}"

          if [[ "$OS_DIR" == Win* ]]; then
            CL_VER=$(cl 2>&1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
            CL_MINOR=$(echo "$CL_VER" | cut -d. -f2)
            if [ -n "$CL_MINOR" ] && [ "$CL_MINOR" -ge 50 ]; then
              COMPILER="msvc2026"
            else
              COMPILER="msvc2022"
            fi
          elif [[ "$OS_DIR" == Ubuntu* ]]; then
            GCC_MAJOR=$(g++ -dumpversion | cut -d. -f1)
            COMPILER="gcc${GCC_MAJOR}"
          elif [ "$OS_DIR" = "MacOS" ]; then
            COMPILER="clang"
          else
            COMPILER="unknown"
          fi

          SUFFIX="${OS_DIR}-${ARCH_DIR}-${COMPILER}"

          [ "${{ inputs.enable_jasper }}" = "true" ] && SUFFIX="${SUFFIX}-jasper"

          CONTRIB_VER="${{ inputs.contrib_version }}"
          [ -z "$CONTRIB_VER" ] && CONTRIB_VER="$VER"
          if [ "${{ inputs.enable_contrib }}" = "true" ]; then
            if [ "$CONTRIB_VER" = "$VER" ]; then
              SUFFIX="${SUFFIX}-contrib"
            else
              CLEAN_CVER=$(echo "$CONTRIB_VER" | tr -cd 'a-zA-Z0-9._-')
              SUFFIX="${SUFFIX}-contrib_${CLEAN_CVER}"
            fi
          fi

          if [ "${{ inputs.enable_cuda }}" = "true" ] && [ "$ARCH_DIR" = "amd64" ] && [ "$OS_DIR" != "MacOS" ]; then
            SUFFIX="${SUFFIX}-cuda"
          fi

          if [ -n "${{ inputs.variant_tag }}" ]; then
            CLEAN_TAG=$(echo "${{ inputs.variant_tag }}" | tr -cd 'a-zA-Z0-9_-')
            SUFFIX="${SUFFIX}-${CLEAN_TAG}"
          fi

          PKG_NAME="libopencv_${VER}"
          ZIP_NAME="${PKG_NAME}-${SUFFIX}.zip"

          echo "Detected: OS=$OS_DIR | ARCH=$ARCH_DIR | COMPILER=$COMPILER"
          echo "Contrib version: $CONTRIB_VER"
          echo "Output ZIP: $ZIP_NAME"

          echo "compiler=$COMPILER" >> $GITHUB_OUTPUT
          echo "contrib_ver=$CONTRIB_VER" >> $GITHUB_OUTPUT
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: 7. Tải mã nguồn OpenCV (và opencv_contrib nếu bật)
        shell: bash
        run: |
          VER="${{ inputs.opencv_version }}"
          mkdir -p opencv-src
          curl -fL -o opencv.tar.gz "https://github.com/opencv/opencv/archive/${VER}.tar.gz"
          tar -xzf opencv.tar.gz -C opencv-src --strip-components=1

          if [ "${{ inputs.enable_contrib }}" = "true" ]; then
            CVER="${{ steps.meta.outputs.contrib_ver }}"
            mkdir -p opencv_contrib-src
            curl -fL -o opencv_contrib.tar.gz "https://github.com/opencv/opencv_contrib/archive/${CVER}.tar.gz"
            tar -xzf opencv_contrib.tar.gz -C opencv_contrib-src --strip-components=1
          fi

      - name: 8. Biên dịch và Cài đặt
        shell: bash
        run: |
          PKG_DIR="$PWD/dist/${{ steps.meta.outputs.pkg_name }}"
          INSTALL_DIR="${PKG_DIR}/${{ steps.platform.outputs.os_dir }}/${{ steps.platform.outputs.arch_dir }}/${{ steps.meta.outputs.compiler }}"
          EXTRA_FLAGS="${{ inputs.custom_cmake_flags }}"

          if [ "${{ steps.platform.outputs.os_dir }}" = "MacOS" ]; then
            if [ "${{ steps.platform.outputs.arch_dir }}" = "amd64" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS -DCMAKE_OSX_ARCHITECTURES=x86_64"
            else
              EXTRA_FLAGS="$EXTRA_FLAGS -DCMAKE_OSX_ARCHITECTURES=arm64"
            fi
          fi

          if [ "${{ inputs.enable_contrib }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS -DOPENCV_EXTRA_MODULES_PATH=$PWD/opencv_contrib-src/modules"
          fi

          if [ "${{ inputs.enable_jasper }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS -DWITH_JASPER=ON -DBUILD_JASPER=ON"
          else
            EXTRA_FLAGS="$EXTRA_FLAGS -DWITH_JASPER=OFF"
          fi

          if [ "${{ inputs.enable_cuda }}" = "true" ] && [ "${{ steps.platform.outputs.arch_dir }}" = "amd64" ] && [ "${{ steps.platform.outputs.os_dir }}" != "MacOS" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS -DWITH_CUDA=ON -DWITH_CUBLAS=ON -DCUDA_FAST_MATH=ON -DOPENCV_DNN_CUDA=ON"
          else
            EXTRA_FLAGS="$EXTRA_FLAGS -DWITH_CUDA=OFF"
          fi

          cmake -S opencv-src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_opencv_python2=OFF \
            -DBUILD_opencv_python3=OFF \
            -DBUILD_JAVA=OFF \
            $EXTRA_FLAGS

          cmake --build build --parallel
          cmake --install build

      - name: 9. Tạo file CMakeLists.txt tự nhận diện OS / Arch / Compiler
        shell: bash
        run: |
          PKG_NAME="${{ steps.meta.outputs.pkg_name }}"
          cat << 'EOF' > "dist/${PKG_NAME}/CMakeLists.txt"
          cmake_minimum_required(VERSION 3.21)

          # 1. Nhận diện chi tiết hệ điều hành
          if(WIN32)
              if(CMAKE_SYSTEM_VERSION VERSION_GREATER_EQUAL "10.0.22000")
                  set(_CV_OS "Win11")
              else()
                  set(_CV_OS "Win10")
              endif()
          elseif(APPLE)
              set(_CV_OS "MacOS")
          elseif(UNIX)
              if(EXISTS "/etc/os-release")
                  file(READ "/etc/os-release" _OS_RELEASE)
                  string(REGEX MATCH "VERSION_ID=\"([0-9]+\\.[0-9]+)\"" _MATCH "${_OS_RELEASE}")
                  if(CMAKE_MATCH_1)
                      set(_CV_OS "Ubuntu${CMAKE_MATCH_1}")
                  else()
                      set(_CV_OS "Linux")
                  endif()
              else()
                  set(_CV_OS "Linux")
              endif()
          else()
              message(FATAL_ERROR "[OpenCV] Hệ điều hành không được hỗ trợ: ${CMAKE_SYSTEM_NAME}")
          endif()

          # 2. Nhận diện kiến trúc CPU
          string(TOLOWER "${CMAKE_SYSTEM_PROCESSOR}" _PROC_LOWER)
          if(_PROC_LOWER MATCHES "aarch64|arm64")
              set(_CV_ARCH "arm64")
          elseif(_PROC_LOWER MATCHES "x86_64|amd64|x64")
              set(_CV_ARCH "amd64")
          else()
              message(FATAL_ERROR "[OpenCV] Kiến trúc CPU không được hỗ trợ: ${CMAKE_SYSTEM_PROCESSOR}")
          endif()

          # 3. Nhận diện trình biên dịch
          if(MSVC)
              if(MSVC_VERSION GREATER_EQUAL 1950)
                  set(_CV_COMPILER "msvc2026")
              else()
                  set(_CV_COMPILER "msvc2022")
              endif()
          elseif(CMAKE_CXX_COMPILER_ID STREQUAL "GNU")
              string(REGEX MATCH "^[0-9]+" _GCC_MAJOR "${CMAKE_CXX_COMPILER_VERSION}")
              set(_CV_COMPILER "gcc${_GCC_MAJOR}")
          elseif(CMAKE_CXX_COMPILER_ID MATCHES "Clang")
              set(_CV_COMPILER "clang")
          else()
              message(FATAL_ERROR "[OpenCV] Trình biên dịch không được hỗ trợ: ${CMAKE_CXX_COMPILER_ID}")
          endif()

          # 4. Tìm thư mục OpenCV tương ứng (kèm fallback Win11 -> Win10 nếu cùng MSVC)
          set(_CV_TARGET_DIR "${CMAKE_CURRENT_SOURCE_DIR}/${_CV_OS}/${_CV_ARCH}/${_CV_COMPILER}")
          if(NOT EXISTS "${_CV_TARGET_DIR}" AND _CV_OS STREQUAL "Win11" AND EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/Win10/${_CV_ARCH}/${_CV_COMPILER}")
              set(_CV_OS "Win10")
              set(_CV_TARGET_DIR "${CMAKE_CURRENT_SOURCE_DIR}/Win10/${_CV_ARCH}/${_CV_COMPILER}")
          endif()

          if(NOT EXISTS "${_CV_TARGET_DIR}")
              message(FATAL_ERROR "[OpenCV] Không tìm thấy bản build OpenCV cho ${_CV_OS}/${_CV_ARCH}/${_CV_COMPILER} tại: ${_CV_TARGET_DIR}")
          endif()

          message(STATUS "[OpenCV] Đang sử dụng bản build cho: ${_CV_OS}/${_CV_ARCH}/${_CV_COMPILER}")

          set(_NEW_PREFIX_PATH "${_CV_TARGET_DIR};${CMAKE_PREFIX_PATH}")
          set(CMAKE_PREFIX_PATH "${_NEW_PREFIX_PATH}" PARENT_SCOPE)
          set(LIBOPENCV_DIR "${_CV_TARGET_DIR}" PARENT_SCOPE)
          EOF

      - name: 10. Nén file ZIP và đăng lên GitHub Releases
        shell: bash
        run: |
          cd dist
          7z a -tzip "../${{ steps.meta.outputs.zip_name }}" "${{ steps.meta.outputs.pkg_name }}"

      - name: 11. Đẩy lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.opencv_version }}
          name: OpenCV ${{ inputs.opencv_version }}
          files: ${{ steps.meta.outputs.zip_name }}
