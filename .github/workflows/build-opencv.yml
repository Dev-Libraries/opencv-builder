name: Build OpenCV Multi-Platform

on:
  workflow_dispatch:
    inputs:
      opencv_version:
        description: 'Phiên bản OpenCV cần build (vd: 4.14.0)'
        required: true
        default: '4.14.0'
      enable_contrib:
        description: 'Kèm module mở rộng opencv_contrib'
        type: boolean
        required: true
        default: true
      enable_jasper:
        description: 'Bật hỗ trợ ảnh JPEG-2000 (JasPer)'
        type: boolean
        required: true
        default: true
      enable_cuda:
        description: 'Bật CUDA (Chỉ áp dụng Linux/Windows amd64 - cần nhiều thời gian & dung lượng)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_dir: Linux
            arch_dir: amd64
          - runner: ubuntu-24.04-arm
            os_dir: Linux
            arch_dir: arm64
          - runner: windows-latest
            os_dir: Windows
            arch_dir: amd64
          - runner: windows-11-arm
            os_dir: Windows
            arch_dir: arm64
          - runner: macos-15-intel
            os_dir: MacOS
            arch_dir: amd64
          - runner: macos-latest
            os_dir: MacOS
            arch_dir: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Cài thư viện hệ thống (Linux)
        if: matrix.os_dir == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config \
            libavcodec-dev libavformat-dev libswscale-dev \
            libjpeg-dev libpng-dev libtiff-dev

      - name: Cài đặt CUDA Toolkit trên Linux (nếu bật enable_cuda)
        if: inputs.enable_cuda && matrix.os_dir == 'Linux' && matrix.arch_dir == 'amd64'
        uses: Jimver/cuda-toolkit@v0.2.20
        with:
          cuda: '12.6.2'

      - name: Cài đặt CUDA Toolkit trên Windows (nếu bật enable_cuda)
        if: inputs.enable_cuda && matrix.os_dir == 'Windows' && matrix.arch_dir == 'amd64'
        uses: Jimver/cuda-toolkit@v0.2.20
        with:
          cuda: '12.6.2'

      - name: Thiết lập MSVC (Windows amd64)
        if: matrix.os_dir == 'Windows' && matrix.arch_dir == 'amd64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Thiết lập MSVC (Windows arm64)
        if: matrix.os_dir == 'Windows' && matrix.arch_dir == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Đảm bảo có Ninja (Windows)
        if: matrix.os_dir == 'Windows'
        shell: bash
        run: command -v ninja >/dev/null 2>&1 || choco install ninja -y

      - name: Cài Ninja (macOS)
        if: matrix.os_dir == 'MacOS'
        run: brew install ninja

      - name: Tải mã nguồn OpenCV (và opencv_contrib nếu bật)
        shell: bash
        run: |
          VER="${{ inputs.opencv_version }}"
          curl -fL -o opencv.tar.gz "https://github.com/opencv/opencv/archive/refs/tags/${VER}.tar.gz"
          tar -xzf opencv.tar.gz
          mv "opencv-${VER}" opencv-src

          if [ "${{ inputs.enable_contrib }}" = "true" ]; then
            curl -fL -o opencv_contrib.tar.gz "https://github.com/opencv/opencv_contrib/archive/refs/tags/${VER}.tar.gz"
            tar -xzf opencv_contrib.tar.gz
            mv "opencv_contrib-${VER}" opencv_contrib-src
          fi

      - name: Biên dịch và Cài đặt vào libopencv_${{ inputs.opencv_version }}/${{ matrix.os_dir }}/${{ matrix.arch_dir }}
        shell: bash
        run: |
          INSTALL_DIR="$PWD/dist/libopencv_${{ inputs.opencv_version }}/${{ matrix.os_dir }}/${{ matrix.arch_dir }}"
          EXTRA_FLAGS=""

          # Cấu hình kiến trúc macOS
          if [ "${{ matrix.os_dir }}" = "MacOS" ]; then
            if [ "${{ matrix.arch_dir }}" = "amd64" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS -DCMAKE_OSX_ARCHITECTURES=x86_64"
            else
              EXTRA_FLAGS="$EXTRA_FLAGS -DCMAKE_OSX_ARCHITECTURES=arm64"
            fi
          fi

          # Cấu hình opencv_contrib
          if [ "${{ inputs.enable_contrib }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS -DOPENCV_EXTRA_MODULES_PATH=$PWD/opencv_contrib-src/modules"
          fi

          # Cấu hình JasPer (dùng bản 3rdparty tích hợp sẵn của OpenCV)
          if [ "${{ inputs.enable_jasper }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS -DWITH_JASPER=ON -DBUILD_JASPER=ON"
          else
            EXTRA_FLAGS="$EXTRA_FLAGS -DWITH_JASPER=OFF"
          fi

          # Cấu hình CUDA (chỉ hỗ trợ Linux/Windows amd64)
          if [ "${{ inputs.enable_cuda }}" = "true" ] && [ "${{ matrix.arch_dir }}" = "amd64" ] && [ "${{ matrix.os_dir }}" != "MacOS" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS -DWITH_CUDA=ON -DWITH_CUBLAS=ON -DCUDA_FAST_MATH=ON -DOPENCV_DNN_CUDA=ON"
          else
            EXTRA_FLAGS="$EXTRA_FLAGS -DWITH_CUDA=OFF"
          fi

          cmake -S opencv-src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_opencv_python2=OFF \
            -DBUILD_opencv_python3=OFF \
            -DBUILD_JAVA=OFF \
            $EXTRA_FLAGS

          cmake --build build --parallel
          cmake --install build

      - name: Lưu tạm kết quả build của nền tảng này
        uses: actions/upload-artifact@v4
        with:
          name: opencv-${{ matrix.os_dir }}-${{ matrix.arch_dir }}
          path: dist/

  package:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Tải và gộp toàn bộ thư mục OS/Arch
        uses: actions/download-artifact@v4
        with:
          path: merged/
          merge-multiple: true

      - name: Tạo file CMakeLists.txt tự nhận diện OS/Arch
        run: |
          cat << 'EOF' > merged/libopencv_${{ inputs.opencv_version }}/CMakeLists.txt
          cmake_minimum_required(VERSION 3.21)

          if(WIN32)
              set(_CV_OS "Windows")
          elseif(APPLE)
              set(_CV_OS "MacOS")
          elseif(UNIX)
              set(_CV_OS "Linux")
          else()
              message(FATAL_ERROR "[libopencv_${{ inputs.opencv_version }}] Hệ điều hành không được hỗ trợ: ${CMAKE_SYSTEM_NAME}")
          endif()

          string(TOLOWER "${CMAKE_SYSTEM_PROCESSOR}" _PROC_LOWER)
          if(_PROC_LOWER MATCHES "aarch64|arm64")
              set(_CV_ARCH "arm64")
          elseif(_PROC_LOWER MATCHES "x86_64|amd64|x64")
              set(_CV_ARCH "amd64")
          else()
              message(FATAL_ERROR "[libopencv_${{ inputs.opencv_version }}] Kiến trúc CPU không được hỗ trợ: ${CMAKE_SYSTEM_PROCESSOR}")
          endif()

          set(_CV_TARGET_DIR "${CMAKE_CURRENT_SOURCE_DIR}/${_CV_OS}/${_CV_ARCH}")
          if(NOT EXISTS "${_CV_TARGET_DIR}")
              message(FATAL_ERROR "[libopencv_${{ inputs.opencv_version }}] Không tìm thấy bản build OpenCV cho ${_CV_OS}/${_CV_ARCH} tại: ${_CV_TARGET_DIR}")
          endif()

          message(STATUS "[libopencv_${{ inputs.opencv_version }}] Đang sử dụng OpenCV ${{ inputs.opencv_version }} cho nền tảng: ${_CV_OS}/${_CV_ARCH}")

          set(_NEW_PREFIX_PATH "${_CV_TARGET_DIR};${CMAKE_PREFIX_PATH}")
          set(CMAKE_PREFIX_PATH "${_NEW_PREFIX_PATH}" PARENT_SCOPE)
          set(LIBOPENCV_DIR "${_CV_TARGET_DIR}" PARENT_SCOPE)
          EOF

      - name: Nén thành file libopencv_${{ inputs.opencv_version }}.zip
        run: |
          cd merged
          zip -r ../libopencv_${{ inputs.opencv_version }}.zip libopencv_${{ inputs.opencv_version }}

      - name: Đẩy lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.opencv_version }}
          name: OpenCV ${{ inputs.opencv_version }} (libopencv_${{ inputs.opencv_version }})
          files: libopencv_${{ inputs.opencv_version }}.zip
